<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>JSON Viewer avec TreeView</title>
  <style>
    body { font-family: Consolas, monospace; margin: 20px; display: flex; gap: 20px; }
    .left { flex: 1; }
    .right { flex: 1; border: 1px solid #ccc; padding: 10px; background: #f9f9f9; overflow:auto; }
    textarea { width: 100%; margin-bottom: 15px; }
    ul { list-style-type: none; padding-left: 20px; }
    li { margin: 2px 0; cursor: pointer; }
    .collapsed > ul { display: none; }
    .toggle { font-weight: bold; margin-right: 5px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="left">
    <textarea id="input" rows="10" placeholder="Collez ici votre JSON brut..."></textarea>
    <br>
    <button onclick="processJson()">Désérialiser et afficher</button>
    <br><br>
    <textarea id="output" rows="20" readonly></textarea>
  </div>

  <div class="right">
    <h3>TreeView</h3>
    <div id="treeview"></div>
  </div>

  <script>
    function formatObject(obj, indent = 0) {
      let indentStr = " ".repeat(indent * 2);
      if (obj === null) return "null";
      if (Array.isArray(obj)) {
        let out = "[\n";
        for (let item of obj) {
          out += formatObject(item, indent + 1) + "\n";
        }
        out += indentStr + "]";
        return out;
      } else if (typeof obj === "object") {
        let out = "{\n";
        for (let key in obj) {
          out += indentStr + key + " = " + formatObject(obj[key], indent + 1) + "\n";
        }
        out += indentStr + "}";
        return out;
      } else {
        return obj.toString();
      }
    }

    function buildTree(obj) {
      if (obj === null) return document.createTextNode("null");
      if (typeof obj !== "object") return document.createTextNode(obj.toString());

      let ul = document.createElement("ul");
      for (let key in obj) {
        let li = document.createElement("li");
        let val = obj[key];

        let toggle = document.createElement("span");
        toggle.textContent = "+";
        toggle.className = "toggle";
        li.appendChild(toggle);

        let label = document.createElement("span");
        label.textContent = key;
        li.appendChild(label);

        if (typeof val === "object" && val !== null) {
          let childTree = buildTree(val);
          li.appendChild(childTree);

          toggle.addEventListener("click", function(e) {
            e.stopPropagation();
            if (li.classList.contains("collapsed")) {
              li.classList.remove("collapsed");
              toggle.textContent = "-";
            } else {
              li.classList.add("collapsed");
              toggle.textContent = "+";
            }
          });
          // par défaut ouvert
          toggle.textContent = "-";
        } else {
          let text = document.createTextNode(" = " + (val === null ? "null" : val.toString()));
          li.appendChild(text);
          toggle.style.visibility = "hidden"; // pas de toggle pour les valeurs simples
        }
        ul.appendChild(li);
      }
      return ul;
    }

    function processJson() {
      try {
        let json = document.getElementById("input").value;
        let obj = JSON.parse(json);

        // affichage texte
        document.getElementById("output").value = formatObject(obj, 0);

        // affichage treeview
        let tree = buildTree(obj);
        let output = document.getElementById("treeview");
        output.innerHTML = "";
        output.appendChild(tree);
      } catch (e) {
        document.getElementById("output").value = "Erreur: " + e.message;
        document.getElementById("treeview").textContent = "Erreur: " + e.message;
      }
    }
  </script>
</body>
</html>
